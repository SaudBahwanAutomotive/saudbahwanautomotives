<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory | SaudBahwanAutomotives</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .inventory-page {
      padding: 50px 20px 80px;
      max-width: 1200px;
      margin: auto;
    }

    .inventory-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .inventory-header h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .inventory-header p {
      color: #aaa;
      font-size: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 35px;
      padding: 20px;
      border-radius: 14px;
      background: #111;
      border: 1px solid #252525;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #181818;
      color: white;
      outline: none;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #777;
    }

    .vehicles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .vehicle-card {
      background: #111;
      border: 1px solid #252525;
      border-radius: 14px;
      overflow: hidden;
      transition: 0.25s ease;
    }

    .vehicle-card:hover {
      transform: translateY(-5px);
      border-color: #444;
    }

    .vehicle-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .vehicle-info {
      padding: 20px;
    }

    .vehicle-info h3 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .vehicle-year {
      color: #aaa;
      margin-bottom: 12px;
    }

    .vehicle-price {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .vehicle-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      color: #bbb;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .vehicle-details div {
      padding: 7px 0;
    }

    .view-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
    }

    .view-btn:hover {
      opacity: 0.85;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
      grid-column: 1 / -1;
    }

    .error {
      color: #ff7777;
    }

    @media (max-width: 900px) {
      .vehicles-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .vehicles-grid {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .inventory-header h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <nav>

      <a href="index.html" class="logo">
        SaudBahwanAutomotives
      </a>

      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="inventory.html">
          Inventory
        </a>

        <a href="contact.html">
          Contact
        </a>

        <a href="login.html" id="loginNavLink">
          Login
        </a>

        <a href="register.html" id="registerNavLink">
          Create Account
        </a>

        <span id="accountNavArea"></span>

      </div>

    </nav>
  </header>


  <!-- INVENTORY -->
  <main class="inventory-page">

    <div class="inventory-header">

      <h1>Our Inventory</h1>

      <p>
        Explore our selection of quality vehicles.
      </p>

    </div>


    <!-- FILTERS -->
    <div class="filters">

      <input
        type="text"
        id="searchInput"
        placeholder="Search make or model..."
      >

      <select id="makeFilter">

        <option value="">
          All Makes
        </option>

      </select>


      <select id="yearFilter">

        <option value="">
          All Years
        </option>

      </select>


      <input
        type="number"
        id="maxPrice"
        placeholder="Maximum price (OMR)"
        min="0"
      >

    </div>


    <!-- VEHICLES -->
    <div
      id="vehiclesGrid"
      class="vehicles-grid"
    >

      <div class="loading">
        Loading vehicles...
      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>

    <p>
      © 2026 SaudBahwanAutomotives.
      All rights reserved.
    </p>

  </footer>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>


  <script>

    let allVehicles = [];


    /*
      OMR PRICE FORMAT
    */
    function formatOMR(value) {

      return "ر.ع. " +
        Number(value || 0).toLocaleString(
          "en-US",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 3
          }
        );

    }


    /*
      ESCAPE HTML
    */
    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      LOAD VEHICLES
    */
    async function loadVehicles() {

      const grid =
        document.getElementById("vehiclesGrid");

      grid.innerHTML =
        '<div class="loading">Loading vehicles...</div>';


      const { data, error } =
        await supabaseClient
          .from("vehicles")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        grid.innerHTML =
          '<div class="error">Unable to load vehicles. Please try again.</div>';

        return;

      }


      allVehicles = data || [];


      populateFilters();

      displayVehicles(allVehicles);

    }


    /*
      POPULATE FILTERS
    */
    function populateFilters() {

      const makeFilter =
        document.getElementById("makeFilter");

      const yearFilter =
        document.getElementById("yearFilter");


      const makes =
        [...new Set(
          allVehicles
            .map(vehicle => vehicle.make)
            .filter(Boolean)
        )]
        .sort();


      const years =
        [...new Set(
          allVehicles
            .map(vehicle => vehicle.year)
            .filter(Boolean)
        )]
        .sort((a, b) => b - a);


      makeFilter.innerHTML =
        '<option value="">All Makes</option>';


      makes.forEach(make => {

        const option =
          document.createElement("option");

        option.value = make;

        option.textContent = make;

        makeFilter.appendChild(option);

      });


      yearFilter.innerHTML =
        '<option value="">All Years</option>';


      years.forEach(year => {

        const option =
          document.createElement("option");

        option.value = year;

        option.textContent = year;

        yearFilter.appendChild(option);

      });

    }


    /*
      DISPLAY VEHICLES
    */
    function displayVehicles(vehicles) {

      const grid =
        document.getElementById("vehiclesGrid");


      if (!vehicles.length) {

        grid.innerHTML =
          '<div class="empty">No vehicles match your search.</div>';

        return;

      }


      grid.innerHTML =
        vehicles.map(vehicle => {

          const image =
            vehicle.image_url ||
            "https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=900&q=80";


          return `

            <article class="vehicle-card">

              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(vehicle.make)} ${escapeHtml(vehicle.model)}"
                loading="lazy"
              >

              <div class="vehicle-info">

                <h3>
                  ${escapeHtml(vehicle.make)}
                  ${escapeHtml(vehicle.model)}
                </h3>

                <div class="vehicle-year">
                  ${escapeHtml(vehicle.year)}
                </div>

                <div class="vehicle-price">
                  ${formatOMR(vehicle.price)}
                </div>

                <div class="vehicle-details">

                  <div>
                    <strong>Mileage:</strong>
                    ${Number(vehicle.mileage || 0).toLocaleString()} km
                  </div>

                  <div>
                    <strong>Transmission:</strong>
                    ${escapeHtml(vehicle.transmission || "N/A")}
                  </div>

                  <div>
                    <strong>Fuel:</strong>
                    ${escapeHtml(vehicle.fuel_type || "N/A")}
                  </div>

                  <div>
                    <strong>Condition:</strong>
                    ${escapeHtml(vehicle.condition || "Used")}
                  </div>

                </div>

                <a
                  class="view-btn"
                  href="car.html?id=${encodeURIComponent(vehicle.id)}"
                >
                  View Vehicle
                </a>

              </div>

            </article>

          `;

        })
        .join("");

    }


    /*
      FILTER VEHICLES
    */
    function filterVehicles() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      const make =
        document
          .getElementById("makeFilter")
          .value;


      const year =
        document
          .getElementById("yearFilter")
          .value;


      const maxPrice =
        document
          .getElementById("maxPrice")
          .value;


      const filtered =
        allVehicles.filter(vehicle => {

          const makeModel =
            `${vehicle.make || ""} ${vehicle.model || ""}`
              .toLowerCase();


          const matchesSearch =
            !search ||
            makeModel.includes(search);


          const matchesMake =
            !make ||
            vehicle.make === make;


          const matchesYear =
            !year ||
            String(vehicle.year) === String(year);


          const matchesPrice =
            !maxPrice ||
            Number(vehicle.price || 0) <= Number(maxPrice);


          return (
            matchesSearch &&
            matchesMake &&
            matchesYear &&
            matchesPrice
          );

        });


      displayVehicles(filtered);

    }


    /*
      FILTER EVENTS
    */
    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        filterVehicles
      );


    document
      .getElementById("makeFilter")
      .addEventListener(
        "change",
        filterVehicles
      );


    document
      .getElementById("yearFilter")
      .addEventListener(
        "change",
        filterVehicles
      );


    document
      .getElementById("maxPrice")
      .addEventListener(
        "input",
        filterVehicles
      );


    /*
      AUTH NAVIGATION
    */
    document.addEventListener(
      "DOMContentLoaded",
      async function () {

        try {

          const {
            data: { user }
          } =
            await supabaseClient.auth.getUser();


          const loginLink =
            document.getElementById(
              "loginNavLink"
            );


          const registerLink =
            document.getElementById(
              "registerNavLink"
            );


          const accountArea =
            document.getElementById(
              "accountNavArea"
            );


          if (!user) {
            return;
          }


          if (loginLink) {
            loginLink.style.display =
              "none";
          }


          if (registerLink) {
            registerLink.style.display =
              "none";
          }


          const accountLink =
            document.createElement("a");

          accountLink.href =
            "account.html";

          accountLink.textContent =
            "My Account";

          accountArea.appendChild(
            accountLink
          );


          const {
            data: profile
          } =
            await supabaseClient
              .from("profiles")
              .select("role")
              .eq("id", user.id)
              .single();


          if (
            profile &&
            profile.role === "admin"
          ) {

            const adminLink =
              document.createElement("a");

            adminLink.href =
              "admin.html";

            adminLink.textContent =
              "Admin Dashboard";

            accountArea.appendChild(
              adminLink
            );

          }


          const logoutLink =
            document.createElement("a");

          logoutLink.href = "#";

          logoutLink.textContent =
            "Logout";


          logoutLink.addEventListener(
            "click",
            async function (event) {

              event.preventDefault();

              logoutLink.textContent =
                "Logging out...";


              const { error } =
                await supabaseClient.auth.signOut();


              if (error) {

                console.error(
                  "Logout error:",
                  error.message
                );

                logoutLink.textContent =
                  "Logout";

                alert(
                  "Unable to log out. Please try again."
                );

                return;

              }


              window.location.href =
                "index.html";

            }
          );


          accountArea.appendChild(
            logoutLink
          );


        } catch (error) {

          console.error(
            "Navigation error:",
            error
          );

        }

      }
    );


    /*
      START
    */
    loadVehicles();

  </script>

</body>

    </html>
