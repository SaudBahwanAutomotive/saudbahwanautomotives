<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | SaudBahwanAutomotives</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 450px;
      background: #15181d;
      padding: 35px;
      border-radius: 16px;
      box-sizing: border-box;
    }

    .auth-box h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .auth-box > p {
      color: #aaa;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0d10;
      color: white;
      font-size: 15px;
    }

    .auth-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #143d28;
      color: #8ff0b5;
    }

    .message.error {
      display: block;
      background: #421c1c;
      color: #ffaaaa;
    }

    .auth-footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
    }

    .auth-footer a {
      color: white;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">
        SaudBahwanAutomotives
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="contact.html">Contact</a>
        <a href="register.html">Create Account</a>
      </div>
    </nav>
  </div>
</header>


<main class="auth-page">

  <div class="auth-box">

    <h1>Welcome Back</h1>

    <p>
      Login to your SaudBahwanAutomotives account.
    </p>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Your password"
          required
        >

      </div>


      <button
        type="submit"
        class="auth-button"
        id="loginButton"
      >
        Login
      </button>


      <div id="message" class="message"></div>

    </form>


    <div class="auth-footer">

      Don't have an account?
      <a href="register.html">
        Create one
      </a>

    </div>

  </div>

</main>


<footer>
  <div class="container">
    <p>
      © 2026 SaudBahwanAutomotives. All rights reserved.
    </p>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>


<script>

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    message.className = "message";
    message.textContent = "";


    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";


    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {
        throw error;
      }


      message.className =
        "message success";

      message.textContent =
        "Login successful. Redirecting...";


      setTimeout(function() {

        window.location.href =
          "index.html";

      }, 800);


    } catch (error) {

      console.error(
        "Login error:",
        error
      );


      message.className =
        "message error";

      message.textContent =
        error.message ||
        "Unable to login. Please check your email and password.";

    }


    loginButton.disabled = false;

    loginButton.textContent =
      "Login";

  });

</script>

</body>
  </html>
