<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | SaudBahwanAutomotives</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .auth-page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 450px;
      background: #15181d;
      padding: 35px;
      border-radius: 16px;
      box-sizing: border-box;
    }

    .auth-box h1 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .auth-box > p {
      color: #aaa;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0b0d10;
      color: white;
      font-size: 15px;
    }

    .auth-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #143d28;
      color: #8ff0b5;
    }

    .message.error {
      display: block;
      background: #421c1c;
      color: #ffaaaa;
    }

    .auth-footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
    }

    .auth-footer a {
      color: white;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">SaudBahwanAutomotives</a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="inventory.html">Inventory</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </div>
</header>


<main class="auth-page">

  <div class="auth-box">

    <h1>Create Account</h1>

    <p>
      Create an account to manage your vehicle enquiries and reservations.
    </p>


    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>

        <input
          type="text"
          id="fullName"
          placeholder="Your full name"
          required
        >
      </div>


      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >
      </div>


      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="At least 6 characters"
          minlength="6"
          required
        >
      </div>


      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Repeat your password"
          minlength="6"
          required
        >
      </div>


      <button
        type="submit"
        class="auth-button"
        id="registerButton"
      >
        Create Account
      </button>


      <div id="message" class="message"></div>

    </form>


    <div class="auth-footer">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

</main>


<footer>
  <div class="container">
    <p>© 2026 SaudBahwanAutomotives. All rights reserved.</p>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>


<script>

  const registerForm =
    document.getElementById("registerForm");

  const registerButton =
    document.getElementById("registerButton");

  const message =
    document.getElementById("message");


  registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const fullName =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    message.className = "message";
    message.textContent = "";


    if (password !== confirmPassword) {

      message.className = "message error";

      message.textContent =
        "Passwords do not match.";

      return;
    }


    registerButton.disabled = true;

    registerButton.textContent =
      "Creating Account...";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });


      if (error) {
        throw error;
      }


      message.className =
        "message success";


      if (data.session) {

        message.textContent =
          "Account created successfully. Redirecting...";

        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);

      } else {

        message.textContent =
          "Account created. Please check your email to confirm your account before logging in.";

      }


    } catch (error) {

      console.error("Registration error:", error);


      message.className =
        "message error";

      message.textContent =
        error.message ||
        "Unable to create your account.";

    }


    registerButton.disabled = false;

    registerButton.textContent =
      "Create Account";

  });

</script>

</body>
  </html>
