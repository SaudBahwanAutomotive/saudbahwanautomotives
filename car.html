<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vehicle Details | SaudBahwanAutomotives</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .car-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      text-decoration: none;
      font-weight: 600;
    }

    #loading {
      text-align: center;
      padding: 80px 20px;
      font-size: 20px;
    }

    #vehicleContent {
      display: none;
    }

    .vehicle-layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .main-image-wrapper {
      position: relative;
      background: #f5f5f5;
      border-radius: 12px;
      overflow: hidden;
    }

    #carImage {
      width: 100%;
      height: 500px;
      object-fit: cover;
      display: block;
    }

    .gallery-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 24px;
      cursor: pointer;
      z-index: 5;
    }

    #prevImage {
      left: 15px;
    }

    #nextImage {
      right: 15px;
    }

    .image-counter {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .thumbnail-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 12px;
    }

    .thumbnail {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
    }

    .thumbnail.active {
      border-color: #111;
    }

    .vehicle-info h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 34px;
    }

    .car-price {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .vehicle-specs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .spec-box {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .spec-label {
      display: block;
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .spec-value {
      font-weight: 600;
    }

    .description {
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .reservation-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 25px;
    }

    .reservation-box h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    #reserveButton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #reserveButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #formMessage {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
    }

    .error-message {
      max-width: 700px;
      margin: 60px auto;
      padding: 25px;
      background: #fff0f0;
      border: 1px solid #e0a0a0;
      border-radius: 10px;
      color: #900;
    }

    @media (max-width: 800px) {
      .vehicle-layout {
        grid-template-columns: 1fr;
      }

      #carImage {
        height: 350px;
      }

      .vehicle-info h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="car-page">

    <a href="inventory.html" class="back-link">
      ← Back to Inventory
    </a>

    <div id="loading">
      Loading vehicle...
    </div>

    <div id="vehicleContent">

      <div class="vehicle-layout">

        <!-- VEHICLE IMAGES -->
        <div>

          <div class="main-image-wrapper">

            <img
              id="carImage"
              src=""
              alt="Vehicle"
            >

            <button
              type="button"
              id="prevImage"
              class="gallery-button"
            >
              ‹
            </button>

            <button
              type="button"
              id="nextImage"
              class="gallery-button"
            >
              ›
            </button>

            <div
              id="imageCounter"
              class="image-counter"
            >
              1 / 1
            </div>

          </div>

          <div
            id="thumbnailContainer"
            class="thumbnail-container"
          ></div>

        </div>

        <!-- VEHICLE INFORMATION -->
        <div class="vehicle-info">

          <h1 id="carTitle">
            Vehicle
          </h1>

          <div
            id="carPrice"
            class="car-price"
          >
            —
          </div>

          <div class="vehicle-specs">

            <div class="spec-box">
              <span class="spec-label">
                Year
              </span>

              <span
                id="carYear"
                class="spec-value"
              >
                —
              </span>
            </div>

            <div class="spec-box">
              <span class="spec-label">
                Mileage
              </span>

              <span
                id="carMileage"
                class="spec-value"
              >
                —
              </span>
            </div>

            <div class="spec-box">
              <span class="spec-label">
                Transmission
              </span>

              <span
                id="carTransmission"
                class="spec-value"
              >
                —
              </span>
            </div>

            <div class="spec-box">
              <span class="spec-label">
                Fuel
              </span>

              <span
                id="carFuel"
                class="spec-value"
              >
                —
              </span>
            </div>

            <div class="spec-box">
              <span class="spec-label">
                Condition
              </span>

              <span
                id="carCondition"
                class="spec-value"
              >
                —
              </span>
            </div>

            <div class="spec-box">
              <span class="spec-label">
                Status
              </span>

              <span
                id="carStatus"
                class="spec-value"
              >
                —
              </span>
            </div>

          </div>

          <div class="description">

            <h2>Description</h2>

            <p id="carDescription">
              —
            </p>

          </div>

          <!-- RESERVATION -->
          <div class="reservation-box">

            <h2>
              Reserve This Vehicle
            </h2>

            <form id="reservationForm">

              <div class="form-group">

                <label for="customerName">
                  Full Name
                </label>

                <input
                  type="text"
                  id="customerName"
                  required
                >

              </div>

              <div class="form-group">

                <label for="customerEmail">
                  Email
                </label>

                <input
                  type="email"
                  id="customerEmail"
                  required
                >

              </div>

              <div class="form-group">

                <label for="customerPhone">
                  Phone
                </label>

                <input
                  type="tel"
                  id="customerPhone"
                  required
                >

              </div>

              <div class="form-group">

                <label for="contactMethod">
                  Preferred Contact Method
                </label>

                <select
                  id="contactMethod"
                  required
                >
                  <option value="">
                    Select one
                  </option>

                  <option value="WhatsApp">
                    WhatsApp
                  </option>

                  <option value="Email">
                    Email
                  </option>

                  <option value="Phone">
                    Phone
                  </option>
                </select>

              </div>

              <div class="form-group">

                <label for="message">
                  Message
                </label>

                <textarea
                  id="message"
                  placeholder="Any questions or additional information?"
                ></textarea>

              </div>

              <button
                type="submit"
                id="reserveButton"
              >
                Reserve Vehicle
              </button>

              <div id="formMessage"></div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- YOUR SUPABASE CONFIG -->
  <script src="app.js"></script>


  <script>

    // --------------------------------------------------
    // GET VEHICLE ID FROM URL
    // --------------------------------------------------

    const urlParams =
      new URLSearchParams(window.location.search);

    const vehicleId =
      urlParams.get("id");


    // --------------------------------------------------
    // ELEMENTS
    // --------------------------------------------------

    const loading =
      document.getElementById("loading");

    const vehicleContent =
      document.getElementById("vehicleContent");

    const carImage =
      document.getElementById("carImage");

    const carTitle =
      document.getElementById("carTitle");

    const carPrice =
      document.getElementById("carPrice");

    const carYear =
      document.getElementById("carYear");

    const carMileage =
      document.getElementById("carMileage");

    const carTransmission =
      document.getElementById("carTransmission");

    const carFuel =
      document.getElementById("carFuel");

    const carCondition =
      document.getElementById("carCondition");

    const carStatus =
      document.getElementById("carStatus");

    const carDescription =
      document.getElementById("carDescription");

    const reservationForm =
      document.getElementById("reservationForm");

    const formMessage =
      document.getElementById("formMessage");

    const reserveButton =
      document.getElementById("reserveButton");

    const thumbnailContainer =
      document.getElementById("thumbnailContainer");

    const prevImage =
      document.getElementById("prevImage");

    const nextImage =
      document.getElementById("nextImage");

    const imageCounter =
      document.getElementById("imageCounter");


    // --------------------------------------------------
    // GALLERY VARIABLES
    // --------------------------------------------------

    let vehicleImages = [];

    let currentImageIndex = 0;


    // --------------------------------------------------
    // FALLBACK IMAGE
    // --------------------------------------------------

    const fallbackImage =
      "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80";


    // --------------------------------------------------
    // FORMAT PRICE
    // --------------------------------------------------

    function formatPrice(price) {

      if (
        price === null ||
        price === undefined ||
        price === ""
      ) {
        return "Price on Request";
      }

      const number =
        Number(price);

      if (isNaN(number)) {
        return price;
      }

      return (
        "ر.ع. " +
        number.toLocaleString(
          "en-US",
          {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          }
        )
      );
    }


    // --------------------------------------------------
    // CREATE GALLERY
    // --------------------------------------------------

    function createGallery() {

      thumbnailContainer.innerHTML = "";

      if (!vehicleImages.length) {

        vehicleImages = [
          fallbackImage
        ];

      }

      if (
        currentImageIndex >=
        vehicleImages.length
      ) {

        currentImageIndex = 0;

      }

      carImage.src =
        vehicleImages[currentImageIndex];

      carImage.onerror =
        function () {

          this.onerror = null;

          this.src = fallbackImage;

        };


      imageCounter.textContent =
        (currentImageIndex + 1) +
        " / " +
        vehicleImages.length;


      vehicleImages.forEach(
        function (image, index) {

          const thumbnail =
            document.createElement("img");

          thumbnail.src = image;

          thumbnail.className =
            "thumbnail" +
            (
              index === currentImageIndex
                ? " active"
                : ""
            );

          thumbnail.alt =
            "Vehicle photo " +
            (index + 1);

          thumbnail.onerror =
            function () {

              this.onerror = null;

              this.src = fallbackImage;

            };

          thumbnail.addEventListener(
            "click",
            function () {

              currentImageIndex = index;

              createGallery();

            }
          );

          thumbnailContainer.appendChild(
            thumbnail
          );

        }
      );


      if (
        vehicleImages.length <= 1
      ) {

        prevImage.style.display = "none";

        nextImage.style.display = "none";

        imageCounter.style.display = "none";

      } else {

        prevImage.style.display = "block";

        nextImage.style.display = "block";

        imageCounter.style.display = "block";

      }

    }


    // --------------------------------------------------
    // LOAD VEHICLE IMAGES
    // --------------------------------------------------

    async function loadVehicleImages(vehicle) {

      vehicleImages = [];

      currentImageIndex = 0;


      // Main vehicle image
      if (
        vehicle &&
        vehicle.image_url
      ) {

        vehicleImages.push(
          vehicle.image_url
        );

      }


      // Additional gallery images
      try {

        const {
          data: additionalImages,
          error: imageError
        } = await supabaseClient
          .from("vehicle_images")
          .select("image_url")
          .eq(
            "vehicle_id",
            vehicle.id
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


        if (imageError) {

          console.warn(
            "Gallery loading failed:",
            imageError
          );

        } else if (
          additionalImages &&
          additionalImages.length
        ) {

          additionalImages.forEach(
            function (item) {

              if (
                item.image_url &&
                !vehicleImages.includes(
                  item.image_url
                )
              ) {

                vehicleImages.push(
                  item.image_url
                );

              }

            }
          );

        }

      } catch (imageError) {

        console.warn(
          "Gallery loading failed:",
          imageError
        );

      }


      if (!vehicleImages.length) {

        vehicleImages.push(
          fallbackImage
        );

      }


      createGallery();

    }


    // --------------------------------------------------
    // SHOW ERROR
    // --------------------------------------------------

    function showError(message) {

      loading.style.display = "none";

      vehicleContent.style.display = "block";

      vehicleContent.innerHTML = `
        <div class="error-message">
          <h2>Unable to load vehicle</h2>
          <p>${message}</p>
          <p>
            Please return to the inventory and try again.
          </p>
          <a href="inventory.html">
            ← Back to Inventory
          </a>
        </div>
      `;

    }


    // --------------------------------------------------
    // LOAD VEHICLE
    // --------------------------------------------------

    async function loadVehicle() {

      console.log(
        "Starting vehicle loading..."
      );

      console.log(
        "Vehicle ID:",
        vehicleId
      );

      console.log(
        "Supabase client:",
        supabaseClient
      );


      // Check vehicle ID
      if (!vehicleId) {

        showError(
          "No vehicle ID was provided in the page URL."
        );

        return;

      }


      // Check Supabase
      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        showError(
          "Supabase client is not available. Check app.js."
        );

        return;

      }


      try {

        console.log(
          "Querying vehicles table..."
        );


        const {
          data: vehicle,
          error
        } = await supabaseClient
          .from("vehicles")
          .select("*")
          .eq("id", vehicleId)
          .maybeSingle();


        console.log(
          "Vehicle data:",
          vehicle
        );

        console.log(
          "Vehicle error:",
          error
        );


        if (error) {

          throw new Error(
            "Vehicle database error: " +
            error.message
          );

        }


        if (!vehicle) {

          throw new Error(
            "Vehicle not found. Vehicle ID: " +
            vehicleId
          );

        }


        // --------------------------------------------------
        // DISPLAY VEHICLE
        // --------------------------------------------------

        const make =
          vehicle.make || "";

        const model =
          vehicle.model || "";

        carTitle.textContent =
          make + " " + model;


        carPrice.textContent =
          formatPrice(
            vehicle.price
          );


        carYear.textContent =
          vehicle.year ||
          "—";


        carMileage.textContent =
          vehicle.mileage !== null &&
          vehicle.mileage !== undefined
            ? Number(
                vehicle.mileage
              ).toLocaleString() +
              " km"
            : "—";


        carTransmission.textContent =
          vehicle.transmission ||
          "—";


        carFuel.textContent =
          vehicle.fuel ||
          "—";


        carCondition.textContent =
          vehicle.condition ||
          "—";


        carStatus.textContent =
          vehicle.status ||
          "Available";


        carDescription.textContent =
          vehicle.description ||
          "Contact us for more information about this vehicle.";


        // --------------------------------------------------
        // LOAD GALLERY
        // --------------------------------------------------

                await loadVehicleImages(
          vehicle
        );


        loading.style.display = "none";

        vehicleContent.style.display = "block";


        console.log(
          "Vehicle loaded successfully."
        );

      } catch (error) {

        console.error(
          "LOAD VEHICLE ERROR:",
          error
        );

        showError(
          error.message ||
          "An unknown error occurred."
        );

      }

    }


    // --------------------------------------------------
    // PREVIOUS IMAGE
    // --------------------------------------------------

    prevImage.addEventListener(
      "click",
      function () {

        if (vehicleImages.length <= 1) {
          return;
        }

        currentImageIndex--;

        if (currentImageIndex < 0) {
          currentImageIndex =
            vehicleImages.length - 1;
        }

        createGallery();

      }
    );


    // --------------------------------------------------
    // NEXT IMAGE
    // --------------------------------------------------

    nextImage.addEventListener(
      "click",
      function () {

        if (vehicleImages.length <= 1) {
          return;
        }

        currentImageIndex++;

        if (
          currentImageIndex >=
          vehicleImages.length
        ) {
          currentImageIndex = 0;
        }

        createGallery();

      }
    );


    // --------------------------------------------------
    // KEYBOARD CONTROLS
    // --------------------------------------------------

    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "ArrowLeft") {
          prevImage.click();
        }

        if (event.key === "ArrowRight") {
          nextImage.click();
        }

      }
    );


    // --------------------------------------------------
    // RESERVATION FORM
    // --------------------------------------------------

    reservationForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        formMessage.textContent = "";

        reserveButton.disabled = true;
        reserveButton.textContent = "Submitting...";

        try {

          const customerName =
            document
              .getElementById("customerName")
              .value
              .trim();

          const customerEmail =
            document
              .getElementById("customerEmail")
              .value
              .trim();

          const customerPhone =
            document
              .getElementById("customerPhone")
              .value
              .trim();

          const contactMethod =
            document
              .getElementById("contactMethod")
              .value;

          const message =
            document
              .getElementById("message")
              .value
              .trim();


          const { error } =
            await supabaseClient
              .from("reservations")
              .insert([
                {
                  vehicle_id: vehicleId,
                  customer_name: customerName,
                  customer_email: customerEmail,
                  customer_phone: customerPhone,
                  contact_method: contactMethod,
                  message: message,
                  status: "Pending",
                  payment_status: "Not Paid"
                }
              ]);


          if (error) {
            throw error;
          }


          formMessage.textContent =
            "Reservation submitted successfully. Our team will contact you shortly.";

          formMessage.style.color = "green";

          reservationForm.reset();

        } catch (error) {

          console.error(
            "Reservation error:",
            error
          );

          formMessage.textContent =
            "Unable to submit reservation: " +
            error.message;

          formMessage.style.color = "red";

        } finally {

          reserveButton.disabled = false;
          reserveButton.textContent =
            "Reserve Vehicle";

        }

      }
    );


    // --------------------------------------------------
    // START
    // --------------------------------------------------

    loadVehicle();

  </script>

</body>

</html>
